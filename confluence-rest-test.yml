---
- name: Confluence-test
  hosts: localhost
  gather_facts: false
  vars:
    env: senuat1
    appversion: "3421.0"
  tasks:
    - name: Get confluence page
      ansible.builtin.uri:
        url: http://192.168.99.100:32769/rest/api/content?title=App%20Version&expand=body.storage,version.latest
        method: GET
        user: "{{ confluenceuser }}"
        password: "{{ confluencepassword }}"
        force_basic_auth: true
        status_code: 200
      register: confluence_page

    - name: Debug
      ansible.builtin.debug:
        var: confluence_page.json.results[0]
        verbosity: "3"
        cmd: ""
    - name: Get page id, version number and new version number
      ansible.builtin.set_fact:
        page_id: "{{ (confluence_page.json.results[0].id) }}"
        version_number: "{{ (confluence_page.json.results[0].version.number) }}"
        new_version_number: "{{ (confluence_page.json.results[0].version.number) | int + 1 }}"

    - name: Debug page id
      ansible.builtin.debug:
        var: page_id
        verbosity: "3"
        cmd: ""
    - name: Debug version number
      ansible.builtin.debug:
        var: version_number
        verbosity: "3"
        cmd: ""
    - name: Debug new version number
      ansible.builtin.debug:
        var: new_version_number
        verbosity: "3"
        cmd: ""
    - name: Debug body
      ansible.builtin.debug:
        var: confluence_page.json.results[0].body.storage.value
        verbosity: "3"
        cmd: ""
    - name: Update the page html, increment the version and update the app version for the environment
      ansible.builtin.set_fact:
        new_html: "{{ confluence_page.json.results[0] | replace(': ' + version_number, ': ' + new_version_number) | regex_replace(env + '.*?<\\/td><td.*?>.*?\\/td>',
          env + '</td><td>' + appversion + '</td>') }}"

    - name: Debug new html
      ansible.builtin.debug:
        var: new_html
        verbosity: "3"
        cmd: ""
    - name: Update confluence page
      ansible.builtin.uri:
        url: http://192.168.99.100:32769/rest/api/content/{{ page_id }}
        method: PUT
        user: "{{ confluenceuser }}"
        password: "{{ confluencepassword }}"
        force_basic_auth: true
        status_code: 200
        body: "{{ new_html }}"
        body_format: json
